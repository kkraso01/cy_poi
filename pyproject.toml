[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cy-poi"
version = "0.1.0"
description = "Reproducible Cyprus OpenStreetMap POI snapshot builder"
requires-python = ">=3.11,<3.14"
dependencies = ["osmium==4.3.2", "shapely==2.2.0", "cryptography==46.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
