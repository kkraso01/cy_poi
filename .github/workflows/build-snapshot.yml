name: Build and publish Cyprus snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: write
concurrency:
  group: cy-poi-snapshot-publish
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Require trusted signing configuration
        env:
          CY_POI_ED25519_PRIVATE_KEY_B64: ${{ secrets.CY_POI_ED25519_PRIVATE_KEY_B64 }}
        run: |
          test -n "$CY_POI_ED25519_PRIVATE_KEY_B64"
          test -s keys/update-public-key.pem
      - name: Check Geofabrik source version
        id: source
        run: |
          SOURCE_URL="$(curl --fail --location --silent --show-error --output /dev/null --write-out '%{url_effective}' https://download.geofabrik.de/europe/cyprus-latest.osm.pbf)"
          SOURCE_FILE="${SOURCE_URL##*/}"
          SOURCE_DATE="$(python -c 'import datetime,re,sys; m=re.fullmatch(r"cyprus-(\d{6}|\d{8})\.osm\.pbf", sys.argv[1]); assert m, "Geofabrik did not return a dated Cyprus extract"; raw=m.group(1); fmt="%y%m%d" if len(raw)==6 else "%Y%m%d"; print(datetime.datetime.strptime(raw,fmt).date().isoformat())' "$SOURCE_FILE")"
          PREVIOUS_DATE=""
          if test -f manifest.json; then
            PREVIOUS_DATE="$(python -c 'import json; print((json.load(open("manifest.json", encoding="utf-8")).get("source") or {}).get("extractTimestamp") or "")')"
            PREVIOUS_DATE="${PREVIOUS_DATE:0:10}"
          fi
          if test "$SOURCE_DATE" = "$PREVIOUS_DATE"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - run: python -m pip install .
      - name: Build complete Cyprus snapshot
        id: build
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          ASSET="cyprus-poi-${VERSION//./-}.sqlite.gz"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
          python scripts/build_snapshot.py --output-dir artifacts --version "$VERSION" --artifact-url "$URL"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Validate snapshot and manifest
        if: steps.source.outputs.changed == 'true'
        run: python scripts/validate_release.py --archive 'artifacts/${{ steps.build.outputs.asset }}' --manifest artifacts/manifest.json
      - name: Sign canonical manifest
        if: steps.source.outputs.changed == 'true'
        env:
          CY_POI_ED25519_PRIVATE_KEY_B64: ${{ secrets.CY_POI_ED25519_PRIVATE_KEY_B64 }}
        run: python scripts/sign_manifest.py
      - name: Publish immutable snapshot release
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ steps.build.outputs.tag }}' 'artifacts/${{ steps.build.outputs.asset }}' 'artifacts/validation-report.json' --title '${{ steps.build.outputs.tag }}' --notes 'Validated complete Cyprus OSM POI snapshot. See validation report and repository data-source/license documentation.'
      - name: Verify public release asset before manifest publication
        if: steps.source.outputs.changed == 'true'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.build.outputs.tag }}/${{ steps.build.outputs.asset }}"
          curl --fail --location --silent --show-error --output artifacts/release-verify.sqlite.gz "$URL"
          python -c 'import hashlib,json,pathlib; m=json.load(open("artifacts/manifest.json", encoding="utf-8")); p=pathlib.Path("artifacts/release-verify.sqlite.gz"); assert p.stat().st_size == m["artifactSizeBytes"], "published asset size mismatch"; assert hashlib.sha256(p.read_bytes()).hexdigest() == m["artifactSha256"], "published asset digest mismatch"'
      - name: Publish manifest last
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp artifacts/manifest.json manifest.json
          cp artifacts/manifest.json.sig manifest.json.sig
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json manifest.json.sig
          git commit -m "Publish signed POI manifest ${{ steps.build.outputs.tag }}"
          git push origin HEAD:main
