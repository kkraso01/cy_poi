name: Build and publish beta Cyprus POI snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cy-poi-beta-publish
  cancel-in-progress: false
jobs:
  build-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Require beta-only signing configuration
        env:
          CY_POI_BETA_ED25519_PRIVATE_KEY_B64: ${{ secrets.CY_POI_BETA_ED25519_PRIVATE_KEY_B64 }}
        run: |
          test -n "$CY_POI_BETA_ED25519_PRIVATE_KEY_B64"
          test -s keys/update-public-key-beta.pem
      - run: python -m pip install .
      - name: Build complete Cyprus snapshot
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          ASSET="cyprus-poi-beta-${VERSION//./-}.sqlite.gz"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/${ASSET}"
          python scripts/build_snapshot.py --output-dir artifacts/beta --version "$VERSION" --artifact-url "$URL"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Validate snapshot and manifest
        run: python scripts/validate_release.py --archive 'artifacts/beta/${{ steps.build.outputs.asset }}' --manifest artifacts/beta/manifest.json
      - name: Sign beta manifest with beta key
        env:
          CY_POI_BETA_ED25519_PRIVATE_KEY_B64: ${{ secrets.CY_POI_BETA_ED25519_PRIVATE_KEY_B64 }}
          CY_POI_ED25519_PRIVATE_KEY_B64: ${{ secrets.CY_POI_BETA_ED25519_PRIVATE_KEY_B64 }}
          CY_POI_PUBLIC_KEY_PATH: keys/update-public-key-beta.pem
          CY_POI_MANIFEST: artifacts/beta/manifest.json
        run: python scripts/sign_manifest.py
      - name: Upload immutable snapshot asset to beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload beta 'artifacts/beta/${{ steps.build.outputs.asset }}' 'artifacts/beta/validation-report.json' --repo "$GITHUB_REPOSITORY"
      - name: Verify public release asset before publishing beta manifest
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/${{ steps.build.outputs.asset }}"
          curl --fail --location --silent --show-error --output artifacts/beta/release-verify.sqlite.gz "$URL"
          python -c 'import hashlib,json,pathlib; m=json.load(open("artifacts/beta/manifest.json", encoding="utf-8")); p=pathlib.Path("artifacts/beta/release-verify.sqlite.gz"); assert p.stat().st_size == m["artifactSizeBytes"], "published asset size mismatch"; assert hashlib.sha256(p.read_bytes()).hexdigest() == m["artifactSha256"], "published asset digest mismatch"'
      - name: Publish beta manifest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p beta
          cp artifacts/beta/manifest.json beta/manifest.json
          cp artifacts/beta/manifest.json.sig beta/manifest.json.sig
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add beta/manifest.json beta/manifest.json.sig
          git commit -m "Publish beta POI manifest ${{ steps.build.outputs.version }}"
          git push origin HEAD:main
